stages: [prepare, test, build, package]

default:
  image: golang:1.24

variables:
  # 当前 Runner 访问 proxy.golang.org 会超时；项目/组级 GOPROXY 变量可覆盖此默认值。
  GOPROXY: "https://goproxy.cn,direct"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"

cache:
  key:
    files:
      - go.sum
  paths:
    - .cache/go-mod/
    - .cache/go-build/

prepare-node:
  stage: prepare
  image: node:22
  cache: []
  script:
    # 从已有 Node 镜像导出运行时，通过 GitLab 制品传递，避免测试时访问 Debian 软件源。
    - mkdir -p tmp/ci-node/bin
    - cp "$(command -v node)" tmp/ci-node/bin/node
    - tmp/ci-node/bin/node --version
  artifacts:
    paths:
      - tmp/ci-node/bin/node
    expire_in: 1 day

test:
  stage: test
  dependencies:
    - prepare-node
  before_script:
    - export PATH="$CI_PROJECT_DIR/tmp/ci-node/bin:$PATH"
    - node --version
  script:
    - go test -race ./...
    - go vet ./...
    - go mod verify
    - go mod tidy -diff

build:
  stage: build
  # 构建只需要 Go，避免下载仅供测试使用的 Node 制品。
  dependencies: []
  script:
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        RELEASE_VERSION="${CI_COMMIT_TAG#v}"
      else
        RELEASE_VERSION="0.0.0-build-${CI_COMMIT_SHORT_SHA}"
      fi
      VERSION="$RELEASE_VERSION" COMMIT="$CI_COMMIT_SHA" BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" sh scripts/build-release-assets.sh
      printf 'RELEASE_VERSION=%s\n' "$RELEASE_VERSION" > bin/version.env
  artifacts:
    paths:
      - bin/
    reports:
      dotenv: bin/version.env

package:
  image: node:22
  stage: package
  needs:
    - job: build
      artifacts: true
  script:
    - test "$(node scripts/package-version.js "$RELEASE_VERSION")" = "$RELEASE_VERSION"
    # 安装测试直接使用 build 作业的本平台制品；Node 作业无需再次调用 Go 编译器。
    - export EVERYLINE_TEST_BINARY="$CI_PROJECT_DIR/bin/$(node -p 'require("./scripts/platform").resolvePlatformTarget()')/everyline-cli-mcp"
    # 先验证源发布契约，再注入允许预发布后缀的 CI 制品版本，避免污染正式版本测试。
    - npm test
    - npm version --no-git-tag-version --allow-same-version "$RELEASE_VERSION"
    - node scripts/sync-skill-versions.js
    - node scripts/sync-mcp-skills.js --package dist
    - sh tests/release/verify-assets.sh
    - EXPECTED_PACKAGE_VERSION="$RELEASE_VERSION" sh tests/release/package-dry-run.sh
    - EXPECTED_VERSION="$RELEASE_VERSION" sh tests/release/local-install.sh
    - node scripts/pack-release.js .
  artifacts:
    paths:
      - everyline-cli-mcp-*.tgz
      - dist/everyline-mcp-skills-*.tgz
      - dist/everyline-mcp-skills-*.tgz.sha256
