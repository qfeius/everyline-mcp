name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_REGISTRY_URL: https://registry.npmjs.org/

jobs:
  release:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: ${{ env.NPM_REGISTRY_URL }}
          package-manager-cache: false

      - name: Validate release version and channel
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          node - "$version" <<'NODE'
          const { appendFileSync } = require("node:fs");
          const pkg = require("./package.json");
          const { validateRelease } = require("./scripts/package-version");
          const version = process.argv[2];
          validateRelease(version, pkg.publishConfig?.tag, "latest");
          if (pkg.name !== "@qfeius/everyline-cli-mcp") throw new Error("npm 包名不匹配");
          // 发布制品的 repository 必须匹配签发 OIDC 的仓库，尽早发现镜像或 fork 配置错误。
          if (pkg.repository?.url !== `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`) {
            throw new Error("npm repository 与 GitHub 发布仓库不匹配");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nchannel=${pkg.publishConfig.tag}\n`);
          NODE
          npm version "$version" --no-git-tag-version --allow-same-version
          node scripts/sync-skill-versions.js

      - name: Test, build and verify installation
        run: make release-check

      # release-check 会按 Tag 修改包和 Skill 版本；GoReleaser 要求工作区完全干净。
      - name: Restore clean checkout for GoReleaser
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish native GitHub release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set artifact versions from tag
        env:
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          node scripts/sync-skill-versions.js

      - name: Package CLI and Skills
        env:
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          # 干净 checkout 清除了 npm 平台二进制，按同一 Tag 重建 npm 和 Skill 制品。
          make release-assets VERSION="$RELEASE_VERSION" PACKAGE_VERSION="$RELEASE_VERSION"
          node scripts/pack-release.js .

      - name: Attach npm and Skill packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        # MCP 制品有独立版本和摘要，与 CLI Skill ZIP 一起附加但不混装。
        run: gh release upload "$GITHUB_REF_NAME" "everyline-cli-mcp-${RELEASE_VERSION}.tgz" dist/*-skill.zip dist/everyline-mcp-skills-*.tgz dist/everyline-mcp-skills-*.tgz.sha256 --clobber

      - name: Publish to npm with OIDC
        env:
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          NPM_TAG: ${{ steps.package.outputs.channel }}
        run: npm publish "everyline-cli-mcp-${RELEASE_VERSION}.tgz" --provenance --access public --tag "$NPM_TAG"
